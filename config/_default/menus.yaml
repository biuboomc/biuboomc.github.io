# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: About
    url: /
    weight: 10
  - name: Publications
    url: /#papers
    weight: 20
  - name: Projects
    url: projects/
    weight: 30
  - name: News
    url: /#news
    weight: 40
  - name: CV
    url: uploads/cv.pdf
    weight: 50
  - name: 中文
    url: zh/
    weight: 60
